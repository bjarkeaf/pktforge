name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  golden-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r model/requirements.txt
      - name: run golden-model self-tests
        run: make golden-check

  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: install oss-cad-suite (Verilator 5.028+)
        run: |
          cd /tmp
          curl -sSL -o oss-cad-suite.tgz \
            https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2025-08-01/oss-cad-suite-linux-x64-20250801.tgz
          tar -xzf oss-cad-suite.tgz
          echo "/tmp/oss-cad-suite/bin" >> $GITHUB_PATH
      - name: verilator version
        run: verilator --version
      - name: install python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r model/requirements.txt -r tb/requirements.txt
      - name: run cocotb suites
        run: make test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator
      - name: verilator lint-only
        run: make lint
